name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: mvn -B -f backend/pom.xml verify
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: admin-web
      - run: node --test miniprogram/tests/*.test.cjs
      - run: docker build -f backend/Dockerfile . && docker build -f admin-web/Dockerfile .
