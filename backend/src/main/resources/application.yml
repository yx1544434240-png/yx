server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: aged-care-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      table-underline: true

# 运行模式: 生产环境默认关闭，开启时需显式传入 APP_DEV_MODE=true
app:
  dev-mode: ${APP_DEV_MODE:false}
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
  lan-sync:
    enabled: false

# 微信小程序接入配置(支持环境变量注入)
wechat:
  miniapp:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}

# 腾讯云 COS 对象存储配置
tencent:
  cos:
    secret-id: ${TENCENT_COS_SECRET_ID:}
    secret-key: ${TENCENT_COS_SECRET_KEY:}
    app-id: ${TENCENT_COS_APP_ID:}
    bucket: ${TENCENT_COS_BUCKET:}
    region: ${TENCENT_COS_REGION:ap-guangzhou}
    domain: ${TENCENT_COS_DOMAIN:}

# 智能派单核心参数配置 (支持动态注入与实验调节)
dispatch:
  timeout-seconds: 120
  scan-interval-seconds: 10
  max-attempts: 3
  speed-km-per-hour: 15.0
  buffer-minutes: 10
  weights:
    distance: 0.35
    quality: 0.30
    workload: 0.25
    familiarity: 0.10
  prior:
    rating: 4.0
    samples: 5

# JWT 鉴权配置(支持环境变量注入)
jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000 # 7天 (毫秒)
